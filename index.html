<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Docket</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F2F0EA;
    --ink: #23211E;
    --ink-soft: #5B584F;
    --slate: #2F4858;
    --ochre: #D98E2B;
    --sage: #6B8F71;
    --hairline: #D8D3C7;
    --priority-high: #B5533C;
    --priority-medium: #D98E2B;
    --priority-low: #6B8F71;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 48px 20px 80px;
  }

  .docket {
    width: 100%;
    max-width: 560px;
  }

  header {
    margin-bottom: 24px;
  }

  .label {
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: 34px;
    margin: 0 0 4px 0;
    line-height: 1.1;
    color: var(--ink);
  }

  .subline {
    font-size: 14px;
    color: var(--ink-soft);
    margin-top: 14px;
  }

  .progress-track {
    height: 2px;
    background: var(--hairline);
    margin-top: 10px;
    position: relative;
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: var(--ochre);
    width: 0%;
    transition: width 0.4s ease;
  }

  .tabs {
    display: flex;
    gap: 18px;
    margin-top: 22px;
    border-bottom: 1px solid var(--hairline);
  }

  .tab {
    background: none;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    color: var(--ink-soft);
    padding: 0 0 10px 0;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.15s ease;
  }

  .tab.active {
    color: var(--ink);
    border-bottom-color: var(--ochre);
  }

  .tab:hover {
    color: var(--ink);
  }

  .view {
    display: none;
  }

  .view.active {
    display: block;
  }

  .task-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid var(--hairline);
  }

  .task:last-child {
    border-bottom: none;
  }

  .check {
    width: 17px;
    height: 17px;
    min-width: 17px;
    margin-top: 2px;
    border-radius: 50%;
    border: 1.5px solid var(--ink-soft);
    cursor: pointer;
    background: transparent;
    position: relative;
    padding: 0;
    transition: all 0.15s ease;
  }

  .check.done {
    background: var(--sage);
    border-color: var(--sage);
  }

  .check.done::after {
    content: '';
    position: absolute;
    left: 5px;
    top: 2px;
    width: 4px;
    height: 8px;
    border-right: 1.5px solid var(--paper);
    border-bottom: 1.5px solid var(--paper);
    transform: rotate(40deg);
  }

  .check.static {
    cursor: default;
  }

  .drag-handle {
    color: var(--ink-soft);
    opacity: 0;
    font-size: 13px;
    width: 12px;
    margin-top: 1px;
    text-align: center;
    cursor: grab;
    user-select: none;
    transition: opacity 0.15s ease;
  }

  .task:hover .drag-handle {
    opacity: 0.4;
  }

  .task.dragging {
    opacity: 0.4;
  }

  .task-textwrap {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .task-text {
    font-size: 15px;
    color: var(--ink);
    word-break: break-word;
    cursor: text;
  }

  .task-text.done {
    color: var(--ink-soft);
    text-decoration: line-through;
    text-decoration-color: var(--hairline);
  }

  .task-note {
    font-size: 12.5px;
    color: var(--ink-soft);
    word-break: break-word;
    cursor: text;
  }

  .task-note.done {
    text-decoration: line-through;
    text-decoration-color: var(--hairline);
  }

  .task-note.empty-note {
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .task:hover .task-note.empty-note {
    opacity: 0.5;
  }

  .task-tags {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
  }

  .task-tags-add {
    font-size: 11px;
    color: var(--ink-soft);
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .task:hover .task-tags-add {
    opacity: 0.5;
  }

  .task-tags-edit {
    font-size: 10px;
    color: var(--ink-soft);
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .task:hover .task-tags-edit {
    opacity: 0.6;
  }

  .task-tags-edit-row {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }

  .task-edit-input {
    width: 100%;
    border: 1px solid var(--hairline);
    border-radius: 4px;
    background: var(--paper);
    font-family: 'Inter', sans-serif;
    padding: 4px 6px;
    outline: none;
    color: var(--ink);
  }

  .task-edit-input.title {
    font-size: 15px;
  }

  .task-edit-input.note {
    font-size: 12.5px;
  }

  .repeat-icon {
    color: var(--slate);
    opacity: 0.55;
    font-size: 13px;
    margin-right: 2px;
  }

  .carry-badge {
    font-size: 11px;
    color: var(--ochre);
    border: 1px solid var(--ochre);
    border-radius: 20px;
    padding: 1px 7px;
    margin-top: 2px;
    opacity: 0.85;
    white-space: nowrap;
  }

  .streak-badge {
    font-size: 11px;
    color: var(--sage);
    border: 1px solid var(--sage);
    border-radius: 20px;
    padding: 1px 7px;
    opacity: 0.85;
    white-space: nowrap;
  }

  .del {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 16px;
    cursor: pointer;
    opacity: 0;
    padding: 2px 4px;
    margin-top: -1px;
    transition: opacity 0.15s ease;
    line-height: 1;
  }

  .task:hover .del {
    opacity: 0.55;
  }

  .del:hover {
    opacity: 1 !important;
    color: var(--ink);
  }

  .empty {
    font-style: italic;
    font-size: 13.5px;
    color: var(--ink-soft);
    padding: 16px 0;
  }

  .add-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 4px;
  }

  .add-input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    padding: 6px 2px;
    color: var(--ink);
    outline: none;
  }

  .add-input::placeholder {
    color: #A8A398;
  }

  .search-input {
    width: 100%;
    border: 1px solid var(--hairline);
    background: var(--paper);
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    padding: 8px 10px;
    color: var(--ink);
    outline: none;
    margin-bottom: 16px;
  }

  .search-input::placeholder {
    color: #A8A398;
  }

  .add-btn {
    background: none;
    border: none;
    color: var(--slate);
    font-size: 20px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
    opacity: 0.75;
    transition: opacity 0.15s ease;
  }

  .add-select {
    border: 1px solid var(--hairline);
    background: var(--paper);
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 4px 6px;
    outline: none;
    max-width: 92px;
  }

  .add-details-toggle {
    background: none;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 0 2px;
    opacity: 0.75;
    white-space: nowrap;
    transition: opacity 0.15s ease;
  }

  .add-details-toggle:hover {
    opacity: 1;
  }

  .add-details-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  .add-btn:hover {
    opacity: 1;
  }

  /* Recurring view */
  .section-title {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 500;
    margin: 22px 0 10px;
  }

  .section-title:first-child {
    margin-top: 4px;
  }

  .recurring-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px 0;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 6px;
  }

  .field-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .field-row label {
    font-size: 12.5px;
    color: var(--ink-soft);
    min-width: 68px;
  }

  .field-row input[type="text"],
  .field-row input[type="date"] {
    flex: 1;
    border: 1px solid var(--hairline);
    background: var(--paper);
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    padding: 7px 9px;
    color: var(--ink);
    outline: none;
  }

  .field-row input[type="checkbox"] {
    width: 15px;
    height: 15px;
    accent-color: var(--sage);
  }

  .checkbox-label {
    font-size: 13px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: unset;
  }

  .save-btn {
    align-self: flex-start;
    background: var(--slate);
    color: var(--paper);
    border: none;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    padding: 8px 16px;
    cursor: pointer;
    opacity: 0.9;
    transition: opacity 0.15s ease;
  }

  .save-btn:hover {
    opacity: 1;
  }

  .recurring-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--hairline);
  }

  .recurring-item:last-child {
    border-bottom: none;
  }

  .recurring-info {
    flex: 1;
  }

  .recurring-text {
    font-size: 14.5px;
    color: var(--ink);
  }

  .recurring-range {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .recurring-range.due-soon {
    color: var(--ochre);
    font-weight: 500;
  }

  /* Notion backlog */
  #notionBacklogSection {
    margin-top: 22px;
  }

  .backlog-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--hairline);
    cursor: grab;
  }

  .backlog-promote-btn {
    background: none;
    border: none;
    color: var(--slate);
    font-size: 18px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
    opacity: 0.6;
    transition: opacity 0.15s ease;
  }

  .backlog-promote-btn:hover {
    opacity: 1;
  }

  .backlog-item:last-child {
    border-bottom: none;
  }

  .backlog-item.dragging {
    opacity: 0.4;
  }

  .backlog-info {
    flex: 1;
    min-width: 0;
  }

  .backlog-text {
    font-size: 14.5px;
    color: var(--ink);
    word-break: break-word;
  }

  .backlog-meta {
    display: flex;
    gap: 6px;
    margin-top: 4px;
    flex-wrap: wrap;
    align-items: center;
  }

  .backlog-badge {
    font-size: 10.5px;
    color: var(--ink-soft);
    border: 1px solid var(--hairline);
    border-radius: 20px;
    padding: 1px 7px;
    white-space: nowrap;
  }

  .backlog-date {
    font-size: 11px;
    color: var(--ink-soft);
    cursor: pointer;
    border-bottom: 1px dotted var(--ink-soft);
  }

  .backlog-date:hover {
    color: var(--ink);
  }

  .backlog-date-input {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 2px 4px;
    background: var(--paper);
    color: var(--ink);
  }

  #notionBacklogSection.dragover #notionBacklogWrap {
    outline: 1px dashed var(--ochre);
    outline-offset: 4px;
    border-radius: 4px;
  }

  .notion-icon {
    color: var(--ochre);
    opacity: 0.7;
    font-size: 11px;
    margin-right: 4px;
  }

  /* History view */
  .history-day {
    margin-bottom: 22px;
  }

  .history-date {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 500;
    margin-bottom: 6px;
  }

  .history-summary {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }

  footer {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 40px;
    opacity: 0.7;
  }
</style>
</head>
<body>

<div class="docket">
  <header>
    <div class="label">Today's docket</div>
    <h1 id="dateHeading"></h1>
    <div class="subline" id="progressText">0 of 0 done</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

    <nav class="tabs">
      <button class="tab active" data-view="today">Today</button>
      <button class="tab" data-view="recurring">Plan ahead</button>
      <button class="tab" data-view="history">History</button>
      <button class="tab" data-view="settings">Settings</button>
    </nav>
  </header>

  <div class="view active" id="view-today">
    <div id="listWrap"></div>

    <div class="add-row">
      <input class="add-input" id="addInput" placeholder="Add a task&hellip;">
      <button class="add-details-toggle" id="addDetailsToggle" style="display: none;">+ details</button>
      <button class="add-btn" id="addBtn">+</button>
    </div>

    <div class="add-details-row" id="addDetailsRow" style="display: none;">
      <select class="add-select" id="addPrioritySelect">
        <option value="">Priority</option>
      </select>
      <input class="add-select" id="addProjectSelect" list="addProjectOptions" placeholder="Project" autocomplete="off">
      <datalist id="addProjectOptions"></datalist>
      <input class="add-select" type="date" id="addDueDateInput" title="Due date">
    </div>

    <div id="notionBacklogSection" style="display: none;">
      <div class="section-title">From Notion</div>
      <div id="notionBacklogWrap"></div>
    </div>
  </div>

  <div class="view" id="view-recurring">
    <div class="section-title">Add a recurring task</div>
    <div class="recurring-form">
      <div class="field-row">
        <label for="recText">Task</label>
        <input type="text" id="recText" placeholder="e.g. Stretch">
      </div>
      <div class="field-row">
        <label for="recStart">Starts</label>
        <input type="date" id="recStart">
      </div>
      <div class="field-row">
        <label for="recEnd">Ends</label>
        <input type="date" id="recEnd">
      </div>
      <div class="field-row">
        <span class="checkbox-label"><input type="checkbox" id="recNoEnd" checked> No end date</span>
      </div>
      <button class="save-btn" id="recSaveBtn">Add recurring task</button>
    </div>

    <div class="section-title">Active &amp; upcoming</div>
    <div id="recurringWrap"></div>

    <div class="section-title">Add a task for a later date</div>
    <div class="recurring-form">
      <div class="field-row">
        <label for="schedText">Task</label>
        <input type="text" id="schedText" placeholder="e.g. Renew passport">
      </div>
      <div class="field-row">
        <label for="schedDate">Date</label>
        <input type="date" id="schedDate">
      </div>
      <button class="save-btn" id="schedSaveBtn">Add scheduled task</button>
    </div>

    <div class="section-title">Scheduled</div>
    <div id="scheduledWrap"></div>
  </div>

  <div class="view" id="view-history">
    <input class="search-input" id="historySearch" placeholder="Search history&hellip;">
    <div id="historyWrap"></div>
  </div>

  <div class="view" id="view-settings">
    <div class="section-title">Sync</div>
    <div class="recurring-form">
      <div class="field-row">
        <label for="ghTokenInput">Token</label>
        <input type="password" id="ghTokenInput" placeholder="GitHub fine-grained token">
      </div>
      <div class="field-row">
        <button class="save-btn" id="ghConnectBtn">Connect</button>
        <button class="save-btn" id="ghDisconnectBtn" style="background: var(--ink-soft);">Disconnect</button>
      </div>
      <div class="recurring-range" id="ghStatus"></div>
    </div>

    <div class="section-title">Notion</div>
    <div class="recurring-form">
      <div class="field-row">
        <label for="notionUrlInput">Worker URL</label>
        <input type="text" id="notionUrlInput" placeholder="https://your-worker.workers.dev">
      </div>
      <div class="field-row">
        <button class="save-btn" id="notionConnectBtn">Connect</button>
        <button class="save-btn" id="notionDisconnectBtn" style="background: var(--ink-soft);">Disconnect</button>
      </div>
      <div class="recurring-range" id="notionStatus"></div>
    </div>
  </div>

  <footer>Today's list resets each day &mdash; unfinished tasks carry forward. Plan ahead for recurring or future tasks.</footer>
</div>

<script>
  const KEY_CURRENT = 'docket:current';
  const KEY_HISTORY = 'docket:history';
  const KEY_RECURRING = 'docket:recurring';
  const KEY_SCHEDULED = 'docket:scheduled';
  const HISTORY_LIMIT = 120;

  function todayKey() {
    return new Date().toISOString().slice(0, 10);
  }

  function uid() {
    return Math.random().toString(36).slice(2, 10);
  }

  function readJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      return fallback;
    }
  }

  function writeJSON(key, value) {
    localStorage.setItem(key, JSON.stringify(value));
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const now = new Date();
    const opts = d.getFullYear() === now.getFullYear()
      ? { weekday: 'long', month: 'long', day: 'numeric' }
      : { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
    return d.toLocaleDateString('en-US', opts);
  }

  function formatDateShort(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function isRecurringActive(rec, dateStr) {
    if (dateStr < rec.start) return false;
    if (rec.end && dateStr > rec.end) return false;
    return true;
  }

  let current = readJSON(KEY_CURRENT, null);
  let history = readJSON(KEY_HISTORY, []);
  let recurring = readJSON(KEY_RECURRING, []);
  let scheduled = readJSON(KEY_SCHEDULED, []);

  // GitHub-backed sync: the whole state lives in one JSON file in this repo
  // (data/docket-data.json), read/written via the GitHub REST API. The
  // token is entered in the Sync section below and lives only in this
  // browser's localStorage — never committed, never sent anywhere but
  // api.github.com. With no token, everything just uses localStorage.
  const GH_OWNER = 'Angela-Jeyachandran';
  const GH_REPO_NAME = 'daily-docket';
  const GH_DATA_PATH = 'data/docket-data.json';
  const KEY_GH_TOKEN = 'docket:gh-token';

  let ghToken = localStorage.getItem(KEY_GH_TOKEN) || '';
  let ghFileSha = null;
  let ghWriteTimer = null;

  function ghHeaders() {
    return { Authorization: 'Bearer ' + ghToken, Accept: 'application/vnd.github+json' };
  }

  function b64EncodeUtf8(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }

  function b64DecodeUtf8(str) {
    return decodeURIComponent(escape(atob(str.replace(/\n/g, ''))));
  }

  async function ghReadState() {
    if (!ghToken) return null;
    const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO_NAME}/contents/${GH_DATA_PATH}`;
    const res = await fetch(url, { headers: ghHeaders() });
    if (res.status === 404) return { exists: false };
    if (!res.ok) throw new Error('GitHub read failed: ' + res.status);
    const json = await res.json();
    ghFileSha = json.sha;
    return { exists: true, data: JSON.parse(b64DecodeUtf8(json.content)) };
  }

  async function ghWriteState() {
    if (!ghToken) return;
    const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO_NAME}/contents/${GH_DATA_PATH}`;
    const body = {
      message: 'Update docket data',
      content: b64EncodeUtf8(JSON.stringify({ current, history, recurring, scheduled }, null, 2)),
    };
    if (ghFileSha) body.sha = ghFileSha;
    try {
      const res = await fetch(url, { method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body) });
      if (res.ok) {
        const json = await res.json();
        ghFileSha = json.content.sha;
      } else if (res.status === 409) {
        // sha changed underneath us (another device wrote) — re-read and retry once
        const fresh = await ghReadState();
        if (fresh && fresh.exists) await ghWriteState();
      }
    } catch (e) {
      // offline or blocked — localStorage already has the data
    }
  }

  // Batch edits into far fewer commits: a save resets a 60s "quiet period"
  // timer rather than writing immediately, so a burst of checkbox clicks or
  // added tasks collapses into one commit. ghDirty covers two safety nets
  // so nothing gets stuck unsaved: a 5-minute max wait during continuous
  // activity, and an immediate flush when the tab is hidden or closed.
  const GH_DEBOUNCE_MS = 60000;
  const GH_MAX_INTERVAL_MS = 5 * 60 * 1000;
  let ghDirty = false;

  function scheduleGhWrite() {
    if (!ghToken) return;
    ghDirty = true;
    if (ghWriteTimer) clearTimeout(ghWriteTimer);
    ghWriteTimer = setTimeout(flushGhWrite, GH_DEBOUNCE_MS);
  }

  async function flushGhWrite() {
    if (ghWriteTimer) {
      clearTimeout(ghWriteTimer);
      ghWriteTimer = null;
    }
    if (!ghToken || !ghDirty) return;
    ghDirty = false;
    await ghWriteState();
  }

  setInterval(() => { if (ghDirty) flushGhWrite(); }, GH_MAX_INTERVAL_MS);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ghDirty) flushGhWrite();
  });

  async function initGhSync() {
    if (!ghToken) return;
    try {
      const result = await ghReadState();
      if (result && result.exists) {
        current = result.data.current || current;
        history = result.data.history || history;
        recurring = result.data.recurring || recurring;
        scheduled = result.data.scheduled || scheduled;
        rolloverIfNeeded();
        renderToday();
      } else {
        scheduleGhWrite();
      }
    } catch (e) {
      // couldn't reach GitHub — local state stands, will retry on next save
    }
  }

  function setGhToken(token) {
    ghToken = token;
    ghFileSha = null;
    if (ghToken) {
      localStorage.setItem(KEY_GH_TOKEN, ghToken);
    } else {
      localStorage.removeItem(KEY_GH_TOKEN);
    }
  }

  function rolloverIfNeeded() {
    const today = todayKey();

    if (!current) {
      current = { date: today, tasks: [] };
    } else if (current.date !== today) {
      const archivedDay = {
        date: current.date,
        tasks: current.tasks.map(t => ({ text: t.text, done: t.done, note: t.note || '' }))
      };
      history.unshift(archivedDay);
      if (history.length > HISTORY_LIMIT) history = history.slice(0, HISTORY_LIMIT);

      const carried = current.tasks
        .filter(t => !t.done)
        .map(t => ({
          id: uid(),
          text: t.text,
          note: t.note || '',
          done: false,
          carryDays: (t.carryDays || 0) + 1,
          recurringId: t.recurringId || null,
          notionPageId: t.notionPageId || null,
          priority: t.priority || null,
          project: t.project || null,
          dueDate: t.dueDate || null
        }));

      current = { date: today, tasks: carried };
    }

    syncRecurringIntoToday();
    syncScheduledIntoToday();
    persist();
  }

  function syncRecurringIntoToday() {
    const today = current.date;
    recurring.forEach(rec => {
      if (!isRecurringActive(rec, today)) return;
      const exists = current.tasks.some(t => t.recurringId === rec.id);
      if (!exists) {
        current.tasks.push({ id: uid(), text: rec.text, note: '', done: false, carryDays: 0, recurringId: rec.id });
      }
    });
  }

  function syncScheduledIntoToday() {
    const today = current.date;
    const due = scheduled.filter(s => s.date <= today);
    if (due.length === 0) return;
    due.forEach(s => {
      current.tasks.push({ id: uid(), text: s.text, note: '', done: false, carryDays: 0, recurringId: null });
    });
    scheduled = scheduled.filter(s => s.date > today);
  }

  function persist() {
    writeJSON(KEY_CURRENT, current);
    writeJSON(KEY_HISTORY, history);
    writeJSON(KEY_RECURRING, recurring);
    writeJSON(KEY_SCHEDULED, scheduled);
    scheduleGhWrite();
  }

  function renderToday() {
    document.getElementById('dateHeading').textContent = formatDate(current.date);

    const wrap = document.getElementById('listWrap');
    wrap.innerHTML = '';
    wrap.addEventListener('dragover', (e) => e.preventDefault());
    wrap.addEventListener('drop', (e) => {
      e.preventDefault();
      if (dragSrcFrom === 'backlog' && dragSrcId) promoteNotionTask(dragSrcId);
      dragSrcId = null;
      dragSrcFrom = null;
    });

    if (current.tasks.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Nothing on the docket yet';
      wrap.appendChild(empty);
    } else {
      const list = document.createElement('ul');
      list.className = 'task-list';
      current.tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task';
        li.draggable = true;

        li.addEventListener('dragstart', () => {
          dragSrcId = task.id;
          dragSrcFrom = 'today';
          li.classList.add('dragging');
        });
        li.addEventListener('dragend', () => li.classList.remove('dragging'));
        li.addEventListener('dragover', (e) => e.preventDefault());
        li.addEventListener('drop', (e) => {
          e.preventDefault();
          if (dragSrcFrom === 'today' && dragSrcId && dragSrcId !== task.id) {
            reorderTasks(dragSrcId, task.id);
          } else if (dragSrcFrom === 'backlog' && dragSrcId) {
            promoteNotionTask(dragSrcId);
          }
          dragSrcId = null;
          dragSrcFrom = null;
        });

        const handle = document.createElement('span');
        handle.className = 'drag-handle';
        handle.textContent = '⠿';

        const check = document.createElement('button');
        check.className = 'check' + (task.done ? ' done' : '');
        check.onclick = () => toggleTask(task.id);

        const textWrap = document.createElement('div');
        textWrap.className = 'task-textwrap';

        const text = document.createElement('span');
        text.className = 'task-text' + (task.done ? ' done' : '');
        text.title = 'Click to edit';
        if (task.recurringId) {
          const icon = document.createElement('span');
          icon.className = 'repeat-icon';
          icon.title = 'Recurring task';
          icon.textContent = '↻';
          text.appendChild(icon);
        }
        if (task.notionPageId) {
          const icon = document.createElement('span');
          icon.className = 'notion-icon';
          icon.title = 'From Notion';
          icon.textContent = '◆';
          text.appendChild(icon);
        }
        text.appendChild(document.createTextNode(task.text));
        text.onclick = () => startEditTitle(task.id, textWrap);
        textWrap.appendChild(text);

        const note = document.createElement('div');
        const hasNote = !!task.note;
        note.className = 'task-note' + (task.done ? ' done' : '') + (hasNote ? '' : ' empty-note');
        note.textContent = hasNote ? task.note : '+ add a note';
        note.title = hasNote ? 'Click to edit note' : 'Click to add a note';
        note.onclick = () => startEditNote(task.id, textWrap);
        textWrap.appendChild(note);

        if (notionWorkerUrl) {
          const tags = document.createElement('div');
          tags.className = 'task-tags';
          if (task.priority || task.project || task.dueDate) {
            if (task.priority) {
              const badge = document.createElement('span');
              badge.className = 'backlog-badge';
              badge.textContent = task.priority;
              const color = PRIORITY_COLORS[task.priority];
              if (color) { badge.style.borderColor = color; badge.style.color = color; }
              tags.appendChild(badge);
            }
            if (task.project) {
              const badge = document.createElement('span');
              badge.className = 'backlog-badge';
              badge.textContent = task.project;
              const color = colorForProject(task.project);
              badge.style.borderColor = color;
              badge.style.color = color;
              tags.appendChild(badge);
            }
            if (task.dueDate) {
              const badge = document.createElement('span');
              badge.className = 'backlog-badge';
              badge.textContent = formatDateShort(task.dueDate);
              tags.appendChild(badge);
            }
            const editLink = document.createElement('span');
            editLink.className = 'task-tags-edit';
            editLink.textContent = 'edit';
            editLink.onclick = () => startEditTags(task.id, textWrap);
            tags.appendChild(editLink);
          } else {
            const addLink = document.createElement('span');
            addLink.className = 'task-tags-add';
            addLink.textContent = '+ details';
            addLink.onclick = () => startEditTags(task.id, textWrap);
            tags.appendChild(addLink);
          }
          textWrap.appendChild(tags);
        }

        li.appendChild(handle);
        li.appendChild(check);
        li.appendChild(textWrap);

        if (task.carryDays > 0) {
          const badge = document.createElement('span');
          badge.className = 'carry-badge';
          badge.textContent = task.carryDays === 1 ? '1 day' : task.carryDays + ' days';
          li.appendChild(badge);
        }

        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '✕';
        del.onclick = () => deleteTask(task.id);
        li.appendChild(del);

        list.appendChild(li);
      });
      wrap.appendChild(list);
    }

    const done = current.tasks.filter(t => t.done).length;
    const total = current.tasks.length;
    document.getElementById('progressText').textContent = `${done} of ${total} done`;
    document.getElementById('progressFill').style.width = total ? `${(done / total) * 100}%` : '0%';
  }

  async function addTask(text, priority, project, dueDate) {
    if (notionWorkerUrl && (priority || project || dueDate)) {
      try {
        const res = await fetch(notionApiUrl('/tasks'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text,
            priority: priority || undefined,
            project: project || undefined,
            status: 'In progress',
            assignedDate: dueDate || current.date,
          }),
        });
        if (res.ok) {
          const created = await res.json();
          current.tasks.push({
            id: uid(), text, note: '', done: false, carryDays: 0, recurringId: null,
            notionPageId: created.id,
            priority: priority || null,
            project: project || null,
            dueDate: dueDate || null,
          });
          persist();
          renderToday();
          return;
        }
      } catch (e) {
        // offline or worker unreachable — fall back to a local-only task
      }
    }
    current.tasks.push({ id: uid(), text, note: '', done: false, carryDays: 0, recurringId: null });
    persist();
    renderToday();
  }

  async function setTaskTags(id, priority, project, dueDate) {
    const task = current.tasks.find(t => t.id === id);
    if (!task) return;
    task.priority = priority || null;
    task.project = project || null;
    task.dueDate = dueDate || null;

    if (notionWorkerUrl) {
      if (task.notionPageId) {
        await patchNotionTask(task.notionPageId, {
          priority: task.priority,
          project: task.project,
          assignedDate: task.dueDate || current.date,
        });
      } else {
        try {
          const res = await fetch(notionApiUrl('/tasks'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              text: task.text,
              priority: task.priority || undefined,
              project: task.project || undefined,
              status: task.done ? 'Done' : 'In progress',
              assignedDate: task.dueDate || current.date,
            }),
          });
          if (res.ok) {
            const created = await res.json();
            task.notionPageId = created.id;
          }
        } catch (e) {
          // offline or worker unreachable — tags stay local-only
        }
      }
    }

    persist();
    renderToday();
  }

  let dragSrcId = null;
  let dragSrcFrom = null; // 'today' | 'backlog'

  function reorderTasks(srcId, targetId) {
    const srcIndex = current.tasks.findIndex(t => t.id === srcId);
    if (srcIndex === -1) return;
    const [item] = current.tasks.splice(srcIndex, 1);
    const targetIndex = current.tasks.findIndex(t => t.id === targetId);
    current.tasks.splice(targetIndex === -1 ? current.tasks.length : targetIndex, 0, item);
    persist();
    renderToday();
  }

  function startEditTitle(id, textWrap) {
    const task = current.tasks.find(t => t.id === id);
    if (!task) return;
    const textEl = textWrap.querySelector('.task-text');

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'task-edit-input title';
    input.value = task.text;
    textWrap.replaceChild(input, textEl);
    input.focus();
    input.select();

    let cancelled = false;
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') input.blur();
      else if (e.key === 'Escape') { cancelled = true; renderToday(); }
    });
    input.addEventListener('blur', () => {
      if (cancelled) return;
      const val = input.value.trim();
      if (val) task.text = val;
      persist();
      renderToday();
    });
  }

  function startEditNote(id, textWrap) {
    const task = current.tasks.find(t => t.id === id);
    if (!task) return;
    const noteEl = textWrap.querySelector('.task-note');

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'task-edit-input note';
    input.placeholder = 'Add a note (optional)';
    input.value = task.note || '';
    textWrap.replaceChild(input, noteEl);
    input.focus();
    input.select();

    let cancelled = false;
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') input.blur();
      else if (e.key === 'Escape') { cancelled = true; renderToday(); }
    });
    input.addEventListener('blur', () => {
      if (cancelled) return;
      task.note = input.value.trim();
      persist();
      renderToday();
      if (notionWorkerUrl && task.notionPageId) {
        patchNotionTask(task.notionPageId, { description: task.note });
      }
    });
  }

  function startEditTags(id, textWrap) {
    const task = current.tasks.find(t => t.id === id);
    if (!task) return;
    const tagsEl = textWrap.querySelector('.task-tags');

    const row = document.createElement('div');
    row.className = 'task-tags-edit-row';

    const prioritySelect = document.createElement('select');
    prioritySelect.className = 'add-select';
    const blankOpt = document.createElement('option');
    blankOpt.value = '';
    blankOpt.textContent = 'Priority';
    prioritySelect.appendChild(blankOpt);
    Array.from(addPrioritySelect.options).slice(1).forEach(o => {
      const opt = document.createElement('option');
      opt.value = o.value;
      opt.textContent = o.value;
      if (task.priority === o.value) opt.selected = true;
      prioritySelect.appendChild(opt);
    });

    const projectInput = document.createElement('input');
    projectInput.className = 'add-select';
    projectInput.setAttribute('list', 'addProjectOptions');
    projectInput.placeholder = 'Project';
    projectInput.autocomplete = 'off';
    projectInput.value = task.project || '';

    const dueDateInput = document.createElement('input');
    dueDateInput.className = 'add-select';
    dueDateInput.type = 'date';
    dueDateInput.title = 'Due date';
    dueDateInput.value = task.dueDate || '';

    row.appendChild(prioritySelect);
    row.appendChild(projectInput);
    row.appendChild(dueDateInput);
    textWrap.replaceChild(row, tagsEl);

    let cancelled = false;
    let committed = false;
    function commit() {
      if (cancelled || committed) return;
      committed = true;
      setTaskTags(task.id, prioritySelect.value, projectInput.value.trim(), dueDateInput.value);
    }

    row.addEventListener('focusout', (e) => {
      if (row.contains(e.relatedTarget)) return;
      commit();
    });
    projectInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') commit();
      else if (e.key === 'Escape') { cancelled = true; renderToday(); }
    });
    dueDateInput.addEventListener('change', commit);
  }

  function toggleTask(id) {
    const task = current.tasks.find(t => t.id === id);
    if (task) {
      task.done = !task.done;
      if (task.notionPageId) {
        patchNotionTask(task.notionPageId, { status: task.done ? 'Done' : 'In progress' });
      }
    }
    persist();
    renderToday();
  }

  function deleteTask(id) {
    current.tasks = current.tasks.filter(t => t.id !== id);
    persist();
    renderToday();
  }

  function computeStreak(rec) {
    const days = [
      { date: current.date, tasks: current.tasks.map(t => ({ text: t.text, done: t.done })) },
      ...history,
    ];
    let streak = 0;
    for (const day of days) {
      if (day.date < rec.start) break;
      if (rec.end && day.date > rec.end) continue;
      const match = day.tasks.find(t => t.text === rec.text);
      if (match && match.done) streak++;
      else break;
    }
    return streak;
  }

  function renderRecurring() {
    const wrap = document.getElementById('recurringWrap');
    wrap.innerHTML = '';

    if (recurring.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No recurring tasks set up';
      wrap.appendChild(empty);
      return;
    }

    recurring
      .slice()
      .sort((a, b) => a.start.localeCompare(b.start))
      .forEach(rec => {
        const row = document.createElement('div');
        row.className = 'recurring-item';

        const info = document.createElement('div');
        info.className = 'recurring-info';

        const text = document.createElement('div');
        text.className = 'recurring-text';
        text.textContent = rec.text;

        const range = document.createElement('div');
        range.className = 'recurring-range';
        range.textContent = rec.end
          ? `${formatDateShort(rec.start)} → ${formatDateShort(rec.end)}`
          : `${formatDateShort(rec.start)} → ongoing`;

        info.appendChild(text);
        info.appendChild(range);

        row.appendChild(info);

        const streak = computeStreak(rec);
        if (streak > 0) {
          const badge = document.createElement('span');
          badge.className = 'streak-badge';
          badge.textContent = streak === 1 ? '1 day streak' : streak + ' day streak';
          row.appendChild(badge);
        }

        const del = document.createElement('button');
        del.className = 'del';
        del.style.opacity = '0.55';
        del.textContent = '✕';
        del.onclick = () => deleteRecurring(rec.id);

        row.appendChild(del);
        wrap.appendChild(row);
      });
  }

  function addRecurring(text, start, end) {
    recurring.push({ id: uid(), text, start, end: end || null });
    syncRecurringIntoToday();
    persist();
    renderRecurring();
    renderToday();
  }

  function deleteRecurring(id) {
    recurring = recurring.filter(r => r.id !== id);
    persist();
    renderRecurring();
  }

  function renderScheduled() {
    const wrap = document.getElementById('scheduledWrap');
    wrap.innerHTML = '';

    if (scheduled.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Nothing scheduled';
      wrap.appendChild(empty);
      return;
    }

    scheduled
      .slice()
      .sort((a, b) => a.date.localeCompare(b.date))
      .forEach(item => {
        const row = document.createElement('div');
        row.className = 'recurring-item';

        const info = document.createElement('div');
        info.className = 'recurring-info';

        const text = document.createElement('div');
        text.className = 'recurring-text';
        text.textContent = item.text;

        const daysUntil = Math.round(
          (new Date(item.date + 'T00:00:00') - new Date(current.date + 'T00:00:00')) / 86400000
        );
        const dueSoon = daysUntil <= 3;

        const date = document.createElement('div');
        date.className = 'recurring-range' + (dueSoon ? ' due-soon' : '');
        date.textContent = (dueSoon ? 'Due soon · ' : '') + formatDateShort(item.date);

        info.appendChild(text);
        info.appendChild(date);

        const del = document.createElement('button');
        del.className = 'del';
        del.style.opacity = '0.55';
        del.textContent = '✕';
        del.onclick = () => deleteScheduled(item.id);

        row.appendChild(info);
        row.appendChild(del);
        wrap.appendChild(row);
      });
  }

  function addScheduled(text, date) {
    scheduled.push({ id: uid(), text, date });
    syncScheduledIntoToday();
    persist();
    renderScheduled();
    renderToday();
  }

  function deleteScheduled(id) {
    scheduled = scheduled.filter(s => s.id !== id);
    persist();
    renderScheduled();
  }

  function renderHistory() {
    const wrap = document.getElementById('historyWrap');
    wrap.innerHTML = '';

    const query = (document.getElementById('historySearch').value || '').trim().toLowerCase();
    const days = query
      ? history.filter(day => day.tasks.some(t =>
          t.text.toLowerCase().includes(query) || (t.note || '').toLowerCase().includes(query)
        ))
      : history;

    if (days.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = query ? 'No matching tasks' : 'No past days yet';
      wrap.appendChild(empty);
      return;
    }

    days.forEach(day => {
      const block = document.createElement('div');
      block.className = 'history-day';

      const heading = document.createElement('div');
      heading.className = 'history-date';
      heading.textContent = formatDate(day.date);
      block.appendChild(heading);

      const done = day.tasks.filter(t => t.done).length;
      const summary = document.createElement('div');
      summary.className = 'history-summary';
      summary.textContent = `${done} of ${day.tasks.length} done`;
      block.appendChild(summary);

      if (day.tasks.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Nothing logged';
        block.appendChild(empty);
      } else {
        const list = document.createElement('ul');
        list.className = 'task-list';
        day.tasks.forEach(task => {
          const li = document.createElement('li');
          li.className = 'task';

          const check = document.createElement('span');
          check.className = 'check static' + (task.done ? ' done' : '');

          const textWrap = document.createElement('div');
          textWrap.className = 'task-textwrap';

          const text = document.createElement('span');
          text.className = 'task-text' + (task.done ? ' done' : '');
          text.textContent = task.text;
          textWrap.appendChild(text);

          if (task.note) {
            const note = document.createElement('div');
            note.className = 'task-note' + (task.done ? ' done' : '');
            note.textContent = task.note;
            textWrap.appendChild(note);
          }

          li.appendChild(check);
          li.appendChild(textWrap);
          list.appendChild(li);
        });
        block.appendChild(list);
      }

      wrap.appendChild(block);
    });
  }

  function switchView(view) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + view));
    if (view === 'recurring') { renderRecurring(); renderScheduled(); }
    if (view === 'history') renderHistory();
  }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => switchView(tab.dataset.view));
  });

  const input = document.getElementById('addInput');
  const addPrioritySelect = document.getElementById('addPrioritySelect');
  const addProjectSelect = document.getElementById('addProjectSelect');
  const addDueDateInput = document.getElementById('addDueDateInput');
  const addDetailsToggle = document.getElementById('addDetailsToggle');
  const addDetailsRow = document.getElementById('addDetailsRow');

  function collapseAddDetails() {
    addDetailsRow.style.display = 'none';
    addDetailsToggle.textContent = '+ details';
  }

  addDetailsToggle.addEventListener('click', () => {
    const open = addDetailsRow.style.display !== 'none';
    addDetailsRow.style.display = open ? 'none' : 'flex';
    addDetailsToggle.textContent = open ? '+ details' : '− details';
  });

  function submitAddTask() {
    if (!input.value.trim()) return;
    addTask(input.value.trim(), addPrioritySelect.value, addProjectSelect.value, addDueDateInput.value);
    input.value = '';
    addPrioritySelect.value = '';
    addProjectSelect.value = '';
    addDueDateInput.value = '';
    collapseAddDetails();
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitAddTask();
  });
  document.getElementById('addBtn').addEventListener('click', submitAddTask);

  const recStart = document.getElementById('recStart');
  const recEnd = document.getElementById('recEnd');
  const recNoEnd = document.getElementById('recNoEnd');
  recStart.value = todayKey();
  recEnd.disabled = true;
  recNoEnd.addEventListener('change', () => {
    recEnd.disabled = recNoEnd.checked;
    if (recNoEnd.checked) recEnd.value = '';
  });

  document.getElementById('recSaveBtn').addEventListener('click', () => {
    const text = document.getElementById('recText').value.trim();
    const start = recStart.value || todayKey();
    const end = recNoEnd.checked ? '' : recEnd.value;
    if (!text) return;
    addRecurring(text, start, end);
    document.getElementById('recText').value = '';
    recStart.value = todayKey();
    recNoEnd.checked = true;
    recEnd.disabled = true;
    recEnd.value = '';
  });

  const schedDate = document.getElementById('schedDate');
  function tomorrowKey() {
    const d = new Date();
    d.setDate(d.getDate() + 1);
    return d.toISOString().slice(0, 10);
  }
  schedDate.value = tomorrowKey();

  document.getElementById('schedSaveBtn').addEventListener('click', () => {
    const text = document.getElementById('schedText').value.trim();
    const date = schedDate.value;
    if (!text || !date) return;
    addScheduled(text, date);
    document.getElementById('schedText').value = '';
    schedDate.value = tomorrowKey();
  });

  const ghTokenInput = document.getElementById('ghTokenInput');
  const ghStatus = document.getElementById('ghStatus');

  function refreshGhStatus() {
    ghStatus.textContent = ghToken
      ? `Connected — syncing to github.com/${GH_OWNER}/${GH_REPO_NAME}`
      : 'Not connected — tasks are only saved in this browser.';
  }
  refreshGhStatus();

  document.getElementById('ghConnectBtn').addEventListener('click', () => {
    const token = ghTokenInput.value.trim();
    if (!token) return;
    setGhToken(token);
    ghTokenInput.value = '';
    refreshGhStatus();
    initGhSync();
  });

  document.getElementById('ghDisconnectBtn').addEventListener('click', () => {
    setGhToken('');
    refreshGhStatus();
  });

  document.getElementById('historySearch').addEventListener('input', renderHistory);

  // Notion sync: open tasks from a Notion database, proxied through a small
  // Cloudflare Worker (Notion's API has no CORS headers, so the browser can't
  // call it directly). The Notion integration token lives only as a Worker
  // secret — the browser only ever holds the Worker's own URL.
  const KEY_NOTION_URL = 'docket:notion-worker-url';
  let notionWorkerUrl = localStorage.getItem(KEY_NOTION_URL) || '';
  let notionBacklog = [];

  function notionApiUrl(path) {
    return notionWorkerUrl.replace(/\/$/, '') + path;
  }

  async function fetchNotionBacklog() {
    if (!notionWorkerUrl) return;
    try {
      const res = await fetch(notionApiUrl('/tasks'));
      if (!res.ok) throw new Error('status ' + res.status);
      notionBacklog = await res.json();
      notionStatus.textContent = `Connected — syncing with ${notionWorkerUrl}`;
    } catch (e) {
      notionStatus.textContent = `Connected — could not reach worker (${e.message})`;
    }
    renderBacklog();
  }

  async function patchNotionTask(pageId, updates) {
    if (!notionWorkerUrl) return;
    try {
      await fetch(notionApiUrl('/tasks/' + pageId), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(updates),
      });
    } catch (e) {
      // offline or worker unreachable — local state stands
    }
  }

  const PRIORITY_COLORS = {
    High: 'var(--priority-high)',
    Medium: 'var(--priority-medium)',
    Low: 'var(--priority-low)',
  };

  const PROJECT_PALETTE = ['#2F4858', '#6B8F71', '#8B5E83', '#3E7C87', '#A6763F', '#B5533C'];

  function colorForProject(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    return PROJECT_PALETTE[hash % PROJECT_PALETTE.length];
  }

  function renderBacklog() {
    const section = document.getElementById('notionBacklogSection');
    const wrap = document.getElementById('notionBacklogWrap');
    wrap.innerHTML = '';

    if (!notionWorkerUrl) {
      section.style.display = 'none';
      return;
    }
    section.style.display = 'block';

    if (notionBacklog.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Notion backlog is empty';
      wrap.appendChild(empty);
      return;
    }

    notionBacklog.forEach(item => {
      const row = document.createElement('div');
      row.className = 'backlog-item';
      row.draggable = true;

      row.addEventListener('dragstart', () => {
        dragSrcId = item.id;
        dragSrcFrom = 'backlog';
        row.classList.add('dragging');
      });
      row.addEventListener('dragend', () => row.classList.remove('dragging'));

      const info = document.createElement('div');
      info.className = 'backlog-info';

      const text = document.createElement('div');
      text.className = 'backlog-text';
      text.textContent = item.text;
      info.appendChild(text);

      const meta = document.createElement('div');
      meta.className = 'backlog-meta';

      if (item.priority) {
        const badge = document.createElement('span');
        badge.className = 'backlog-badge';
        badge.textContent = item.priority;
        const color = PRIORITY_COLORS[item.priority];
        if (color) { badge.style.borderColor = color; badge.style.color = color; }
        meta.appendChild(badge);
      }
      if (item.project) {
        const badge = document.createElement('span');
        badge.className = 'backlog-badge';
        badge.textContent = item.project;
        const color = colorForProject(item.project);
        badge.style.borderColor = color;
        badge.style.color = color;
        meta.appendChild(badge);
      }

      if (item.assignedDate) {
        const dateEl = document.createElement('span');
        dateEl.className = 'backlog-date';
        dateEl.textContent = formatDateShort(item.assignedDate);
        dateEl.title = 'Click to change date';
        dateEl.onclick = () => startEditBacklogDate(item, meta, dateEl);
        meta.appendChild(dateEl);
      }

      info.appendChild(meta);
      row.appendChild(info);

      const promoteBtn = document.createElement('button');
      promoteBtn.className = 'backlog-promote-btn';
      promoteBtn.textContent = '+';
      promoteBtn.title = 'Add to today';
      promoteBtn.onclick = (e) => {
        e.stopPropagation();
        promoteNotionTask(item.id);
      };
      row.appendChild(promoteBtn);

      wrap.appendChild(row);
    });
  }

  function startEditBacklogDate(item, meta, dateEl) {
    const input = document.createElement('input');
    input.type = 'date';
    input.className = 'backlog-date-input';
    input.value = item.assignedDate || '';
    meta.replaceChild(input, dateEl);
    input.focus();

    let cancelled = false;
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') input.blur();
      else if (e.key === 'Escape') { cancelled = true; renderBacklog(); }
    });
    input.addEventListener('blur', async () => {
      if (cancelled) return;
      const val = input.value;
      if (val && val !== item.assignedDate) {
        item.assignedDate = val;
        await patchNotionTask(item.id, { assignedDate: val });
      }
      renderBacklog();
    });
  }

  async function promoteNotionTask(pageId) {
    const idx = notionBacklog.findIndex(b => b.id === pageId);
    if (idx === -1) return;
    const item = notionBacklog[idx];

    current.tasks.push({
      id: uid(),
      text: item.text,
      note: '',
      done: false,
      carryDays: 0,
      recurringId: null,
      notionPageId: item.id,
      priority: item.priority || null,
      project: item.project || null,
    });
    notionBacklog.splice(idx, 1);
    persist();
    renderToday();
    renderBacklog();

    await patchNotionTask(item.id, { assignedDate: current.date, status: 'In progress' });
  }

  function sendTaskToBacklog(taskId) {
    const idx = current.tasks.findIndex(t => t.id === taskId);
    if (idx === -1) return;
    const task = current.tasks[idx];
    if (!task.notionPageId) return;
    current.tasks.splice(idx, 1);
    persist();
    renderToday();
    fetchNotionBacklog();
  }

  const notionUrlInput = document.getElementById('notionUrlInput');
  const notionStatus = document.getElementById('notionStatus');

  function setNotionWorkerUrl(url) {
    notionWorkerUrl = url;
    if (notionWorkerUrl) {
      localStorage.setItem(KEY_NOTION_URL, notionWorkerUrl);
    } else {
      localStorage.removeItem(KEY_NOTION_URL);
    }
  }

  function refreshNotionStatus() {
    notionStatus.textContent = notionWorkerUrl
      ? `Connected — syncing with ${notionWorkerUrl}`
      : 'Not connected — no Notion backlog shown.';
  }
  refreshNotionStatus();

  function populateSelectOptions(select, values) {
    while (select.options.length > 1) select.remove(1);
    values.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      select.appendChild(opt);
    });
  }

  function populateDatalistOptions(datalist, values) {
    datalist.innerHTML = '';
    values.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      datalist.appendChild(opt);
    });
  }

  async function fetchNotionMeta() {
    if (!notionWorkerUrl) return;
    try {
      const res = await fetch(notionApiUrl('/meta'));
      if (!res.ok) return;
      const meta = await res.json();
      populateSelectOptions(addPrioritySelect, meta.priorities || []);
      populateDatalistOptions(document.getElementById('addProjectOptions'), meta.projects || []);
    } catch (e) {
      // offline or worker unreachable — selects stay empty
    }
  }

  function refreshAddTaskControls() {
    const show = !!notionWorkerUrl;
    addDetailsToggle.style.display = show ? '' : 'none';
    if (!show) collapseAddDetails();
  }

  async function initNotionSync() {
    refreshNotionStatus();
    refreshAddTaskControls();
    if (notionWorkerUrl) {
      await fetchNotionBacklog();
      await fetchNotionMeta();
    } else {
      renderBacklog();
    }
  }

  document.getElementById('notionConnectBtn').addEventListener('click', () => {
    const url = notionUrlInput.value.trim();
    if (!url) return;
    setNotionWorkerUrl(url);
    notionUrlInput.value = '';
    initNotionSync();
  });

  document.getElementById('notionDisconnectBtn').addEventListener('click', () => {
    setNotionWorkerUrl('');
    notionBacklog = [];
    refreshNotionStatus();
    refreshAddTaskControls();
    renderBacklog();
  });

  const notionSection = document.getElementById('notionBacklogSection');
  notionSection.addEventListener('dragover', (e) => {
    if (dragSrcFrom !== 'today') return;
    e.preventDefault();
    notionSection.classList.add('dragover');
  });
  notionSection.addEventListener('dragleave', () => notionSection.classList.remove('dragover'));
  notionSection.addEventListener('drop', (e) => {
    e.preventDefault();
    notionSection.classList.remove('dragover');
    if (dragSrcFrom === 'today' && dragSrcId) sendTaskToBacklog(dragSrcId);
    dragSrcId = null;
    dragSrcFrom = null;
  });

  rolloverIfNeeded();
  renderToday();
  initGhSync();
  initNotionSync();
</script>

</body>
</html>
